{{define "index"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Todo List</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- By default HTMX ignores 4xx/5xx responses. This tells it to swap them too,
       so validation errors from Go show up on the page. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true},{"code":"...","swap":true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <main class="container">
    <h1>My Todo List</h1>

    <form class="add-form" hx-post="/todos" hx-target="#todo-list" hx-swap="beforeend"
          hx-on::after-request="if (event.detail.xhr.status < 300) this.reset()">
      <input type="text" name="title" placeholder="What needs to be done?" maxlength="200" required autofocus>
      <button type="submit" class="btn btn-primary">Add Todo</button>
    </form>

    <div id="message" role="alert"></div>

    <div id="todo-container">
      {{template "todo-list" .}}
    </div>
  </main>
</body>
</html>{{end}}
